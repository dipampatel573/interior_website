# The Vite app lives in the "intirior" subfolder, so Netlify must build from there.
[build]
  base = "intirior"
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single-page app fallback: serve index.html for unknown paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
